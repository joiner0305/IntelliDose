<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliDose · Monitoreo</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --panel:#121a2b; --panel-2:#0e1626; --line:#223049; --line-soft:#1a2338;
    --text:#eaf0f6; --dim:#7c8ba3; --dim-2:#4e5c74;
    --teal:#16c2b7; --blue:#3b82f6; --amber:#f2a93b; --green:#34d399; --red:#f2545b;
    --grad: linear-gradient(135deg, var(--blue), var(--teal));
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "Inter", -apple-system, Segoe UI, Roboto, sans-serif;
    --display: "Space Grotesk", var(--sans);
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,0.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(22,194,183,0.08), transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:56px 20px 80px;
  }
  ::selection{background:rgba(59,130,246,0.35);}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .wrap{width:100%; max-width:880px;}

  /* ================= HEADER ================= */
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid var(--line-soft);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:28px; height:28px; border-radius:8px; display:block;}
  .brand .word{font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-0.01em;}
  .brand .word b{color:var(--teal); font-weight:600;}
  .brand .tag{font-family:var(--mono); font-size:11px; color:var(--dim); margin-left:2px; padding-left:10px; border-left:1px solid var(--line);}
  #userbar{font-family:var(--mono); font-size:12px; color:var(--dim); display:flex; gap:12px; align-items:center;}
  #userbar button{background:none; border:1px solid var(--line); color:var(--dim); font-size:11px; padding:6px 12px; border-radius:99px; cursor:pointer; transition:.15s;}
  #userbar button:hover{color:var(--text); border-color:var(--dim-2);}

  /* ================= STAT STRIP ================= */
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:20px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .stat .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); font-weight:600; margin-bottom:10px;}
  .stat .v{font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-0.01em; line-height:1.1;}
  .stat .v small{font-family:var(--sans); font-size:12px; color:var(--dim); font-weight:500; display:block; margin-top:4px;}
  .stat .v.accent{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  @media (max-width:680px){ .stats{grid-template-columns:1fr;} }

  /* ================= PANELS ================= */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .panel h2{font-family:var(--display); font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600;}
  .count-badge{font-family:var(--mono); font-size:11px; color:var(--dim-2); background:var(--panel-2); border:1px solid var(--line); padding:2px 8px; border-radius:99px;}

  /* ---- Auth ---- */
  #auth-panel{max-width:380px; margin:64px auto 0;}
  #auth-panel .panel{padding:32px 30px; position:relative; overflow:hidden;}
  #auth-panel .panel::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad);}
  .auth-logo-wrap{display:flex; justify-content:center; margin-bottom:22px; position:relative;}
  .auth-logo-glow{position:absolute; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, rgba(22,194,183,0.20), transparent 70%); filter:blur(6px);}
  .auth-logo{position:relative; display:block; max-width:190px; width:100%; height:auto; border-radius:10px;}
  #auth-title{font-family:var(--display); font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); font-weight:600; text-align:center; margin-bottom:22px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; color:var(--dim); margin-bottom:6px; font-weight:500;}
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 13px; border-radius:9px; font-size:14px; font-family:var(--sans); transition:.15s;
  }
  .field input::placeholder{color:var(--dim-2);}
  .field input:focus{outline:none; border-color:var(--teal); background:#0c1220;}
  .btn{
    width:100%; background:var(--grad); color:#051012; border:none; padding:12px;
    border-radius:99px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:8px;
    font-family:var(--sans); transition:.15s; letter-spacing:.01em;
  }
  .btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .switch{text-align:center; font-size:12.5px; color:var(--dim); margin-top:18px; cursor:pointer; transition:.15s;}
  .switch:hover{color:var(--teal);}
  .err{color:var(--red); font-size:12.5px; margin-top:12px; text-align:center; display:none;}

  /* ---- Schedules ---- */
  .schedule-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--line-soft);
  }
  .schedule-row:last-child{border-bottom:none;}
  .schedule-row .time-chip{
    font-family:var(--mono); font-size:12.5px; font-weight:500; color:var(--text);
    background:var(--panel-2); border:1px solid var(--line); padding:5px 12px; border-radius:99px;
  }
  .schedule-row .label{color:var(--dim); font-family:var(--sans); font-size:12.5px; margin-left:12px;}
  .del{background:none; border:none; color:var(--dim-2); cursor:pointer; font-size:17px; line-height:1; padding:4px 8px; border-radius:6px; transition:.15s;}
  .del:hover{color:var(--red); background:rgba(242,84,91,0.08);}
  .add-row{display:flex; gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line-soft);}
  .add-row input{background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:9px 11px; font-family:var(--mono); font-size:13px;}
  .add-row input:focus{outline:none; border-color:var(--teal);}
  .add-row input[type=time]{flex:0 0 128px;}
  .add-row input[type=text]{flex:1; font-family:var(--sans);}
  .add-row button{flex:0 0 auto; background:var(--text); color:#0b1220; border:none; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s;}
  .add-row button:hover{background:var(--teal); color:#051012;}

  /* ---- Events ---- */
  .event{display:flex; align-items:flex-start; gap:13px; padding:13px 4px; border-bottom:1px solid var(--line-soft);}
  .event:last-child{border-bottom:none;}
  .icon{
    width:30px; height:30px; border-radius:9px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{width:15px; height:15px;}
  .icon.dispensed{background:rgba(124,139,163,0.14); color:var(--dim);}
  .icon.alert{background:rgba(242,169,59,0.14); color:var(--amber);}
  .icon.taken{background:rgba(52,211,153,0.14); color:var(--green);}
  .icon.timeout{background:rgba(242,84,91,0.14); color:var(--red);}
  .event .txt{font-size:13.5px; font-weight:500;}
  .event .meta{font-family:var(--mono); font-size:11px; color:var(--dim-2); margin-top:3px;}
  .empty{color:var(--dim); font-size:13px; padding:6px 4px;}

  #app-panel{display:none;}
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ AUTENTICACIÓN ============ -->
  <div id="auth-panel">
    <div class="panel">
      <div class="auth-logo-wrap">
        <div class="auth-logo-glow"></div>
        <img src="assets/logo.png" alt="IntelliDose" class="auth-logo">
      </div>
      <h2 id="auth-title">Iniciar sesión</h2>
      <div class="field"><label>Correo</label><input id="auth-email" type="email" placeholder="tu@correo.com"></div>
      <div class="field"><label>Contraseña</label><input id="auth-pass" type="password" placeholder="••••••••"></div>
      <button class="btn" id="auth-submit">Entrar</button>
      <div class="err" id="auth-err"></div>
      <div class="switch" id="auth-switch">¿No tienes cuenta? Regístrate</div>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="app-panel">
    <header>
      <div class="brand">
        <img src="assets/favicon.png" alt="">
        <div class="word"><b>Intelli</b>Dose</div>
        <div class="tag">monitoreo</div>
      </div>
      <div id="userbar">
        <span id="user-email"></span>
        <button id="logout-btn">Salir</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="k">Próxima dosis</div>
        <div class="v accent" id="stat-next">—</div>
      </div>
      <div class="stat">
        <div class="k">Adherencia · 7 días</div>
        <div class="v" id="stat-adherence">—</div>
      </div>
      <div class="stat">
        <div class="k">Última actividad</div>
        <div class="v" id="stat-activity">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Horarios programados</h2>
        <span class="count-badge" id="schedule-count">0</span>
      </div>
      <div id="schedule-list"><div class="empty">Cargando…</div></div>
      <div class="add-row">
        <input type="time" id="new-time" step="1" value="08:00:00">
        <input type="text" id="new-label" placeholder="Etiqueta (ej: Losartán)">
        <button id="add-schedule">Agregar</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Notificaciones</h2>
        <span class="count-badge" id="event-count">0</span>
      </div>
      <div id="event-list"><div class="empty">Cargando…</div></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// -----------------------------------------------------------
// Configuración: valores de Supabase y Render
// -----------------------------------------------------------
const SUPABASE_URL = "https://pqsvhpbktgnnujfbdqrs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxc3ZocGJrdGdubnVqZmJkcXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0OTI1NDUsImV4cCI6MjEwMDA2ODU0NX0.TGZIM43atupworGCN9PYKUbmBBO2hJHmwL2hWTgn2ik";
const API_BASE_URL = "https://intellidose.onrender.com";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isRegisterMode = false;
let session = null;
let currentSchedules = [];

const $ = (id) => document.getElementById(id);

// ---------------- ICONOS ----------------
const icons = {
  dispensed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="10" width="18" height="7" rx="3.5" transform="rotate(-25 12 12)"/><line x1="9.5" y1="8.7" x2="14.5" y2="15.3" transform="rotate(-25 12 12)"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>',
  taken: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  timeout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
};

// ---------------- AUTH ----------------
$('auth-switch').onclick = () => {
  isRegisterMode = !isRegisterMode;
  $('auth-title').textContent = isRegisterMode ? 'Crear cuenta' : 'Iniciar sesión';
  $('auth-submit').textContent = isRegisterMode ? 'Registrarme' : 'Entrar';
  $('auth-switch').textContent = isRegisterMode ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
  $('auth-err').style.display = 'none';
};

$('auth-submit').onclick = async () => {
  const email = $('auth-email').value.trim();
  const password = $('auth-pass').value;
  $('auth-err').style.display = 'none';

  const { data, error } = isRegisterMode
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  if (error) {
    $('auth-err').style.color = 'var(--red)';
    $('auth-err').textContent = error.message;
    $('auth-err').style.display = 'block';
    return;
  }

  if (isRegisterMode && !data.session) {
    $('auth-err').style.color = 'var(--green)';
    $('auth-err').textContent = 'Cuenta creada. Revisa tu correo para confirmar el acceso.';
    $('auth-err').style.display = 'block';
    return;
  }

  onAuthenticated(data.session);
};

$('logout-btn').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

async function onAuthenticated(sess) {
  session = sess;
  $('auth-panel').style.display = 'none';
  $('app-panel').style.display = 'block';
  $('user-email').textContent = session.user.email;
  await loadSchedules();
  await loadEvents();
  subscribeRealtime();
}

// ---------------- API helper ----------------
async function api(path, options = {}) {
  const res = await fetch(API_BASE_URL + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.status === 204 ? null : res.json();
}

// ---------------- HORARIOS ----------------
async function loadSchedules() {
  const list = await api('/api/schedules');
  currentSchedules = list;
  const el = $('schedule-list');
  el.innerHTML = '';
  $('schedule-count').textContent = list.length;
  if (!list.length) { el.innerHTML = '<div class="empty">Sin horarios programados.</div>'; updateNextDose(); return; }
  for (const s of list) {
    const row = document.createElement('div');
    row.className = 'schedule-row';
    const t = [s.hour, s.minute, s.second].map(n => String(n).padStart(2, '0')).join(':');
    row.innerHTML = `<span><span class="time-chip">${t}</span><span class="label">${s.label || ''}</span></span>`;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×';
    del.onclick = () => deleteSchedule(s.id);
    row.appendChild(del);
    el.appendChild(row);
  }
  updateNextDose();
}

$('add-schedule').onclick = async () => {
  const [hour, minute, second] = $('new-time').value.split(':').map(Number);
  const label = $('new-label').value.trim();
  await api('/api/schedules', { method: 'POST', body: JSON.stringify({ hour, minute, second: second || 0, label }) });
  $('new-label').value = '';
  await loadSchedules();
};

async function deleteSchedule(id) {
  await api('/api/schedules/' + id, { method: 'DELETE' });
  await loadSchedules();
}

function updateNextDose() {
  if (!currentSchedules.length) { $('stat-next').innerHTML = '—<small>Sin horarios</small>'; return; }
  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const toSec = s => s.hour * 3600 + s.minute * 60 + s.second;
  const upcoming = currentSchedules.map(s => ({ s, diff: toSec(s) - nowSec }))
    .map(x => x.diff < 0 ? { ...x, diff: x.diff + 86400 } : x)
    .sort((a, b) => a.diff - b.diff)[0];
  const t = [upcoming.s.hour, upcoming.s.minute, upcoming.s.second].map(n => String(n).padStart(2, '0')).join(':');
  $('stat-next').innerHTML = `${t}<small>${upcoming.s.label || 'Sin etiqueta'}</small>`;
}

// ---------------- EVENTOS / NOTIFICACIONES ----------------
const eventText = {
  dispensed: 'Medicamento dispensado',
  alert: 'Alerta: el medicamento sigue en la bandeja',
  taken: 'Medicamento retirado por el paciente',
  timeout: 'Tiempo límite alcanzado sin retiro'
};

async function loadEvents() {
  const list = await api('/api/events');
  renderEvents(list);
  updateStats(list);
}

function renderEvents(list) {
  const el = $('event-list');
  el.innerHTML = '';
  $('event-count').textContent = list.length;
  if (!list.length) { el.innerHTML = '<div class="empty">Sin notificaciones aún.</div>'; return; }
  for (const e of list) {
    const row = document.createElement('div');
    row.className = 'event';
    const delayTxt = e.delay_seconds != null ? ` · ${e.delay_seconds}s` : '';
    row.innerHTML = `
      <div class="icon ${e.type}">${icons[e.type] || ''}</div>
      <div>
        <div class="txt">${eventText[e.type] || e.type}${delayTxt}</div>
        <div class="meta">${new Date(e.created_at).toLocaleString('es-CO')}</div>
      </div>`;
    el.appendChild(row);
  }
}

function updateStats(list) {
  // Última actividad
  if (list.length) {
    const last = new Date(list[0].created_at);
    const diffMin = Math.round((Date.now() - last.getTime()) / 60000);
    let txt;
    if (diffMin < 1) txt = 'Justo ahora';
    else if (diffMin < 60) txt = `Hace ${diffMin} min`;
    else if (diffMin < 1440) txt = `Hace ${Math.round(diffMin / 60)} h`;
    else txt = `Hace ${Math.round(diffMin / 1440)} d`;
    $('stat-activity').innerHTML = `${txt}<small>${eventText[list[0].type] || list[0].type}</small>`;
  } else {
    $('stat-activity').innerHTML = '—<small>Sin actividad aún</small>';
  }

  // Adherencia (últimos 7 días): % de tomas dentro del umbral de alerta (30s) sin timeout
  const weekAgo = Date.now() - 7 * 86400000;
  const recent = list.filter(e => new Date(e.created_at).getTime() >= weekAgo && (e.type === 'taken' || e.type === 'timeout'));
  if (!recent.length) {
    $('stat-adherence').innerHTML = '—<small>Sin datos aún</small>';
  } else {
    const onTime = recent.filter(e => e.type === 'taken' && (e.delay_seconds == null || e.delay_seconds <= 30)).length;
    const pct = Math.round((onTime / recent.length) * 100);
    $('stat-adherence').innerHTML = `${pct}%<small>${recent.length} dosis registradas</small>`;
  }
}

// Supabase Realtime: nuevas filas en `events` llegan aquí al instante,
// sin necesidad de infraestructura de push aparte.
function subscribeRealtime() {
  sb.channel('events-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, () => {
      loadEvents();
    })
    .subscribe();
}

// Refresca "próxima dosis" cada minuto aunque no haya cambios
setInterval(() => { if (session) updateNextDose(); }, 60000);

// ---------------- Sesión existente al cargar ----------------
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) onAuthenticated(data.session);
})();
</script>
</body>
</html>
